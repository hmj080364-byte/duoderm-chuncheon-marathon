<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>춘천마라톤 듀오덤 이벤트</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 320px;
            width: 90%;
        }
        .hashtag-box {
            background: #f0f0f0;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin: 15px 0 25px 0;
            word-break: break-all;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(220, 39, 67, 0.3);
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🏃‍♂️ 춘천마라톤 X 듀오덤</h2>
    <p>아래 버튼을 누르면 해시태그가 자동 복사되고 인스타그램으로 이동합니다.</p>
    
    <!-- 적용된 해시태그 -->
    <div class="hashtag-box" id="hashtags">
        #듀오덤 #DuoDERM #상처엔듀오덤 #춘천마라톤
    </div>

    <button class="btn" onclick="copyAndOpenInsta()">해시태그 복사 후 인스타 열기</button>
</div>

<script>
function copyAndOpenInsta() {
    const textToCopy = document.getElementById("hashtags").innerText.trim();
    
    // 현대 클립보드 API
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert("해시태그가 복사되었습니다! 인스타그램에 붙여넣어 보세요.");
            window.location.href = "instagram://app";
        }).catch(err => {
            fallbackCopy(textToCopy);
        });
    } else {
        fallbackCopy(textToCopy);
    }
}

// 구형 모바일 호환용 복사 기능
function fallbackCopy(text) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    try {
        document.execCommand("copy");
        alert("해시태그가 복사되었습니다! 인스타그램에 붙여넣어 보세요.");
        window.location.href = "instagram://app";
    } catch (err) {
        alert("복사에 실패했습니다. 해시태그를 직접 길게 눌러 복사해 주세요.");
    }
    document.body.removeChild(textarea);
}
</script>

</body>
</html>
