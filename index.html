<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>춘천마라톤 듀오덤 이벤트</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 320px;
            width: 90%;
        }
        .hashtag-box {
            background: #f0f0f0;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin: 15px 0 20px 0;
            word-break: break-all;
            line-height: 1.5;
        }
        .btn {
            border: none;
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        /* 인스타그램 버튼 스타일 */
        .btn-insta {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(220, 39, 67, 0.3);
        }
        /* 카카오톡 버튼 스타일 */
        .btn-kakao {
            background-color: #FEE500;
            color: #191919;
            box-shadow: 0 4px 10px rgba(254, 229, 0, 0.4);
            margin-bottom: 0;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🏃‍♂️ 춘천마라톤 X 듀오덤</h2>
    <p>원하시는 앱 버튼을 누르면 해시태그가 복사된 후 해당 앱으로 이동합니다.</p>
    
    <!-- 적용된 해시태그 -->
    <div class="hashtag-box" id="hashtags">
        #듀오덤 #DuoDERM #상처엔듀오덤 #춘천마라톤
    </div>

    <button class="btn btn-insta" onclick="handleCopyAndRedirect('insta')">복사 후 인스타 스토리 업로드하기</button>
    <button class="btn btn-kakao" onclick="handleCopyAndRedirect('kakao')">복사 후 카카오톡 소식 업로드하기</button>
</div>

<script>
async function handleCopyAndRedirect(appType) {
    const textToCopy = document.getElementById("hashtags").innerText.trim();
    let copied = false;

    // 1. 클립보드 복사 시도
    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(textToCopy);
            copied = true;
        } else {
            copied = fallbackCopy(textToCopy);
        }
    } catch (err) {
        copied = fallbackCopy(textToCopy);
    }

    // 2. 복사 결과 안내 및 앱 실행
    if (copied) {
        if (appType === 'insta') {
            alert("해시태그가 복사되었습니다!\n인스타그램 스토리/게시물에 붙여넣어 보세요.");
            // 인스타그램 웹/앱 호환 보편적 URL
            window.location.href = "https://www.instagram.com/";
        } else if (appType === 'kakao') {
            alert("해시태그가 복사되었습니다!\n카카오톡 소식/스토리에 붙여넣어 보세요.");
            // 카카오톡 실행 (안드로이드/iOS 호환)
            openKakaoApp();
        }
    } else {
        alert("해시태그 자동 복사에 실패했습니다. 해시태그를 직접 길게 눌러 복사해 주세요.");
    }
}

// 카카오톡 앱 열기 (OS별 분기 처리)
function openKakaoApp() {
    const userAgent = navigator.userAgent.toLowerCase();
    const isAndroid = userAgent.indexOf("android") > -1;
    const isIos = userAgent.indexOf("iphone") > -1 || userAgent.indexOf("ipad") > -1;

    if (isAndroid) {
        // 안드로이드 크롬/웨일 등 브라우저 블로킹 우회용 인텐트
        window.location.href = "intent://launch#Intent;scheme=kakaolink;package=com.kakao.talk;end";
    } else if (isIos) {
        // iOS 카카오톡 실행 스킴
        window.location.href = "kakaolink://launch";
    } else {
        window.location.href = "https://www.kakaocorp.com/page/service/service/KakaoTalk";
    }
}

// 구형 모바일/보안 브라우저 호환용 텍스트 복사
function fallbackCopy(text) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    
    let success = false;
    try {
        success = document.execCommand("copy");
    } catch (err) {
        success = false;
    }
    document.body.removeChild(textarea);
    return success;
}
</script>

</body>
</html>
